[纯色]
gen_en = 0//是否需要生成1生成，0不生成
gray_value = 255,0,0;0,255,0;0,0,255;0,255,255//纯色图颜色设置，分别代表R、G、B值，若需要多个颜色的图，用;隔开
bmp_width = 1080//生成图片的宽度
bmp_height = 2400//生成图片的高度
[灰阶过渡]
gen_en = 0//是否需要生成1生成，0不生成
transition_type = 1//横向过渡或纵向过渡，只有1和非1设置选项
max_gray = 0,255,255//设置的最大灰阶值，分别代表R、G、B值
min_gray = 0,20,20//设置的最小灰阶值，分别代表R、G、B值
bmp_width = 1080//生成图片的宽度
bmp_height = 2400//生成图片的高度
[中间方形]
gen_en = 0//是否需要生成1生成，0不生成
back_color = 0,0,0//大背景色设置，分别代表R、G、B值
center_color = 255,255,255//方形颜色设置，分别代表R、G、B值
center_start_row = 1200//方形框起始行值
center_start_col = 520//方形框起始列值
center_width = 200//方形框宽度值
center_height = 600//方形框高度值
bmp_width = 1080//生成图片的宽度
bmp_height = 2400//生成图片的高度
[棋盘格]
gen_en = 0//是否需要生成1生成，0不生成
sub_type1_color = 255,0,0//格子1的颜色，分别代表R、G、B值
